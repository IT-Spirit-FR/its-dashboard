name: AI Visibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  ai-visibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY manquante"
            exit 1
          fi
          echo "Secret présent"

      - name: Create test result
        run: |
          cat > data/ai-results.json << 'EOF'
          {
            "updated_at": "$(date -u +%F)",
            "results": [
              {
                "faq_id": "faq-001",
                "google_ai": false,
                "gemini": true,
                "chatgpt": false,
                "competitor": ""
              }
            ]
          }
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/ai-results.json

          git diff --cached --quiet || (
            git commit -m "Update AI visibility results"
            git push
          )
