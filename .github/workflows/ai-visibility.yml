name: AI Visibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  ai-visibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY manquante"
            exit 1
          fi
          echo "Secret présent"

      - name: Install dependencies
        run: npm install

      - name: Run AI visibility
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ai-visibility

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/ai-results.json

          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi

          git commit -m "Update AI visibility results"

          git pull --rebase origin main
          git push origin HEAD:main
